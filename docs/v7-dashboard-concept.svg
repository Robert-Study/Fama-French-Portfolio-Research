  <text x="48" y="161" font-size="18" font-weight="700">£10,000</text>
  <rect x="263" y="116" width="164" height="63" rx="8" class="card"/>
  <text x="279" y="136" class="small">Horizon</text>
  <text x="279" y="161" font-size="18" font-weight="700">10 years</text>
  <path d="m400 151 5 5 5-5" fill="none" stroke="#61727B" stroke-width="1.5"/>
