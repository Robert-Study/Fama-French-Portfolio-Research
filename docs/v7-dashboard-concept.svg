  <text x="54" y="350" class="small">One solved portfolio at each point. Move the slider to see the allocation.</text>
  <rect x="683" y="314" width="134" height="23" rx="11" fill="#F0F4F5"/>
  <text x="750" y="330" text-anchor="middle" font-size="10" style="fill:#61727B">SCHEMATIC CURVE</text>
