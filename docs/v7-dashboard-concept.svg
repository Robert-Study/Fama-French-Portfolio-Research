  <text x="1312" y="328" text-anchor="end" class="small" style="fill:#137363">Fund details →</text>
  <text x="878" y="355" class="small">Instrument / asset</text>
  <text x="1190" y="355" text-anchor="end" class="small">Weight</text>
  <text x="1312" y="355" text-anchor="end" class="small">Amount</text>
  <path d="M878 366H1312 M878 415H1312 M878 464H1312 M878 513H1312 M878 562H1312 M878 611H1312" class="rule"/>

  <rect x="878" y="378" width="4" height="25" rx="2" fill="#168779"/>
  <text x="893" y="390" class="body">Developed-market equity</text>
  <text x="893" y="405" font-size="10" class="muted">Actual fund / share class to be selected</text>
  <text x="1190" y="397" text-anchor="end" class="body">—</text>
  <text x="1312" y="397" text-anchor="end" class="body">—</text>

  <rect x="878" y="427" width="4" height="25" rx="2" fill="#65AA9D"/>
  <text x="893" y="439" class="body">Factor-tilted equity</text>
  <text x="893" y="454" font-size="10" class="muted">Equity exposure and concentration checks</text>
  <text x="1190" y="446" text-anchor="end" class="body">—</text>
  <text x="1312" y="446" text-anchor="end" class="body">—</text>

  <rect x="878" y="476" width="4" height="25" rx="2" fill="#56748F"/>
  <text x="893" y="488" class="body">GBP government bonds</text>
  <text x="893" y="503" font-size="10" class="muted">Yield, duration and rate scenarios</text>
  <text x="1190" y="495" text-anchor="end" class="body">—</text>
  <text x="1312" y="495" text-anchor="end" class="body">—</text>

  <rect x="878" y="525" width="4" height="25" rx="2" fill="#BA9256"/>
  <text x="893" y="537" class="body">Physical gold</text>
  <text x="893" y="552" font-size="10" class="muted">Commodity price and currency exposure</text>
  <text x="1190" y="544" text-anchor="end" class="body">—</text>
  <text x="1312" y="544" text-anchor="end" class="body">—</text>

