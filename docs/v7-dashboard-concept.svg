<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="794" viewBox="0 0 1366 794" role="img" aria-labelledby="title desc">
  <title id="title">V7 portfolio research dashboard concept</title>
  <desc id="desc">A compact dashboard with three views, four headline metrics, an efficient frontier beside allocation, and an exposure summary. All values are placeholders. The curve is schematic and is not an investment result.</desc>
  <defs>
    <style>
      text { font-family: 'DejaVu Sans', sans-serif; fill: #192C35; }
      .small { font-size: 12px; fill: #61727B; }
      .body { font-size: 14px; }
      .muted { fill: #61727B; }
      .label { font-size: 13px; fill: #61727B; }
      .heading { font-size: 18px; font-weight: 700; }
      .metric { font-size: 28px; font-weight: 700; }
      .rule { stroke: #E5EBED; stroke-width: 1; }
      .card { fill: #FFFFFF; stroke: #DEE6E8; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1366" height="794" fill="#F4F7F8"/>
  <rect width="1366" height="66" fill="#FFFFFF"/>
  <path d="M0 66H1366" class="rule"/>
  <rect x="32" y="22" width="9" height="23" rx="2" fill="#168779"/>
  <rect x="45" y="15" width="9" height="30" rx="2" fill="#19343F"/>
  <text x="66" y="39" font-size="20" font-weight="700">Portfolio research</text>
  <rect x="282" y="22" width="36" height="24" rx="6" fill="#ECF2F4"/>
  <text x="300" y="38" text-anchor="middle" class="small">V7</text>
