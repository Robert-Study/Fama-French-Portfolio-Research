  <text x="748" y="39" class="body muted">Data &amp; method</text>
  <rect x="1190" y="16" width="144" height="35" rx="7" fill="#FFFFFF" stroke="#D4DEE1"/>
  <text x="1262" y="38" text-anchor="middle" class="body">Save / export ↓</text>

  <text x="32" y="94" class="body muted">GBP · Nominal values · Before personal tax</text>
