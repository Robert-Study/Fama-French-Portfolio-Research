  <text x="1334" y="754" text-anchor="end" class="small" style="fill:#137363">View assumptions &amp; limitations →</text>
  <text x="32" y="778" font-size="10" class="muted">Layout proposal only. Amount and horizon are sample inputs; the frontier and all outputs require verified data and completed models.</text>
