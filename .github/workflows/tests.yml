name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        installer: [pip, uv]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
      - name: Install runtime with pip
        if: matrix.installer == 'pip'
        run: python -m pip install -r requirements.txt
      - name: Install runtime with uv
        if: matrix.installer == 'uv'
        run: |
          python -m pip install uv==0.12.23
          uv pip install --system --python python -r requirements.txt
      - name: Check runtime before adding test tools
        run: |
          python -m pip check
          python -c "from portfolio.calibration import fit_ff5; from portfolio.results import legacy_run; import streamlit, plotly, openpyxl"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

